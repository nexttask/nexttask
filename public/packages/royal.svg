<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rylGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="rylCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#180404"/>
      <stop offset="100%" stop-color="#0c0202"/>
    </linearGradient>
    <filter id="rylShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer Double Gold Rim -->
  <circle cx="64" cy="64" r="58" fill="url(#rylGold)" filter="url(#rylShadow)"/>
  <circle cx="64" cy="64" r="54" fill="#0f0505"/>
  <circle cx="64" cy="64" r="50" fill="url(#rylCore)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#rylGold)" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Grand Imperial Crown -->
  <g transform="translate(64,58) scale(1.1) translate(-64,-58)">
    <path d="M38 42 L48 76 L64 84 L80 76 L90 42 L74 54 L64 34 L54 54 Z" fill="url(#rylGold)" stroke="#fef08a" stroke-width="2"/>
    <!-- Jewels on crown peaks -->
    <circle cx="64" cy="34" r="4.5" fill="#ef4444" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="38" cy="42" r="3.5" fill="#3b82f6" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="90" cy="42" r="3.5" fill="#3b82f6" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Crown band jewels -->
    <circle cx="54" cy="74" r="2.5" fill="#22c55e"/>
    <circle cx="64" cy="77" r="3" fill="#ef4444"/>
    <circle cx="74" cy="74" r="2.5" fill="#22c55e"/>
  </g>
  <rect x="28" y="98" width="72" height="18" rx="9" fill="#0f0505" stroke="url(#rylGold)" stroke-width="1.5"/>
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">ROYAL</text>
</svg>
  <g transform="translate(64,58) scale(1) translate(-64,-58)">
    <polygon points="64,24 74,48 98,58 74,68 64,92 54,68 30,58 54,48" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="64,32 71,50 88,58 71,66 64,84 57,66 40,58 57,50" fill="#0284c7"/>
    <circle cx="64" cy="58" r="8" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <rect x="24" y="98" width="80" height="18" rx="9" fill="#04121e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PLATINUM</text>

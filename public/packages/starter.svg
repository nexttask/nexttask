<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="stGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="stGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="stGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0"/>
    </radialGradient>
    <filter id="stShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer Gold Rim -->
  <circle cx="64" cy="64" r="58" fill="url(#stGold)" filter="url(#stShadow)"/>
  <circle cx="64" cy="64" r="54" fill="#0f172a"/>
  <!-- Inner Green Gem -->
  <circle cx="64" cy="64" r="50" fill="url(#stGreen)"/>
  <circle cx="64" cy="64" r="50" fill="url(#stGlow)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#stGold)" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Starter Sprout / Rocket Icon -->
  <g transform="translate(64,64) scale(0.9) translate(-64,-64)">
    <path d="M64 26 C52 44 46 62 46 76 C46 86 54 94 64 94 C74 94 82 86 82 76 C82 62 76 44 64 26 Z" fill="url(#stGold)" filter="url(#stShadow)"/>
    <path d="M64 36 C56 50 52 64 52 74 C52 81 57 86 64 86 C71 86 76 81 76 74 C76 64 72 50 64 36 Z" fill="#22c55e"/>
    <path d="M64 42 L64 84" stroke="url(#stGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="64" cy="58" r="4" fill="#fef08a"/>
    <!-- Wing leaves -->
    <path d="M46 76 C36 78 30 88 32 94 C38 96 48 90 48 82 Z" fill="url(#stGold)"/>
    <path d="M82 76 C92 78 98 88 96 94 C90 96 80 90 80 82 Z" fill="url(#stGold)"/>
  </g>
  <!-- Mini Banner -->
  <rect x="28" y="98" width="72" height="18" rx="9" fill="#0f172a" stroke="url(#stGold)" stroke-width="1.5"/>
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">STARTER</text>
</svg>